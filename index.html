<DOCTYPE html>
<html>
<body>
<h2> Yoshi </h2>
<p> Click a button and see what happens! </p>
<img id="yoshi" src="images/yoshi.jpeg" style="width:300px;height:auto;">
<br>
<button onclick="document.getElementById('yoshi').style.width = '100px' ;document.body.style.backgroundColor = FFFFFF">Shrink me!</button>
<button onclick="document.getElementById('yoshi').src = 'images/luigi.png';document.body.style.backgroundColor = 203011">Call A friend!</button>
<button onclick="document.getElementById('yoshi').src = 'images/moto.webp';document.body.style.backgroundColor = 401311">Go faster!</button>
<button onclick="document.getElementById('yoshi').src = 'images/yoshi.jpeg'; document.getElementById('yoshi').style.width = '300px'; document.body.style.backgroundColor = '#FFFFFF';">Back to normal...</button>
<script src="myScript.js"></script>
</body>
